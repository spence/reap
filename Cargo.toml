[package]
name = "reap"
version = "0.1.0"
edition = "2021"
description = "Reclaims superseded Cargo build artifacts and retires declared temporary checkouts"
license = "MIT"

[[bin]]
name = "reap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
gix-config = { version = "0.62.2", default-features = false }
gix-index = { version = "0.58.0", default-features = false, features = ["sha1", "sha256"] }
libc = { version = "0.2", features = ["extra_traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[profile.release]
strip = true
opt-level = 2
