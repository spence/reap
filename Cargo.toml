[package]
name = "reap"
version = "0.1.0"
edition = "2021"
description = "Reclaims superseded Cargo build artifacts and retires declared temporary checkouts"
license = "MIT"

[[bin]]
name = "reap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = { version = "0.2", features = ["extra_traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
filetime = "0.2"

[profile.release]
strip = true
opt-level = 2
