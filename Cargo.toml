[package]
name = "reap"
version = "0.1.0"
edition = "2021"
description = "Safe, per-project reclamation of Cargo build artifacts"
license = "MIT"

[[bin]]
name = "reap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
filetime = "0.2"

[profile.release]
strip = true
opt-level = 2
